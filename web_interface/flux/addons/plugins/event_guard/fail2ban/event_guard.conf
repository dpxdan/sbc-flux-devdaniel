# /etc/fail2ban/jail.d/event_guard.conf
#
# Jails para o Event Guard do FluxSBC.
# Bans injetados diretamente via:
#   fail2ban-client set <jail> banip <ip>

[sip-auth-fail]
enabled  = true
filter   = sip-auth-fail
backend  = polling
logpath  = /dev/null
bantime  = 3600
maxretry = 1
action   = iptables-allports[name=sip-auth-fail, protocol=all]

[sip-auth-ip]
enabled  = true
filter   = sip-auth-ip
backend  = polling
logpath  = /dev/null
bantime  = 3600
maxretry = 1
action   = iptables-allports[name=sip-auth-ip, protocol=all]
